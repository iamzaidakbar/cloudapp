fullname: cloudshiftg
environment: development

image:
  registry: us-central1-docker.pkg.dev/PROJECT/cloudshiftg
  webTag: latest
  workerTag: latest
  terraformJobTag: latest
  pullPolicy: IfNotPresent

cloudsql:
  enabled: true
  instanceConnectionName: PROJECT:REGION:INSTANCE
  proxyImage: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3

migrate:
  enabled: true

web:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

worker:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

serviceAccount:
  web:
    name: cloudshiftg-web
    gcpServiceAccount: cloudshiftg-web@PROJECT.iam.gserviceaccount.com
  worker:
    name: cloudshiftg-worker
    gcpServiceAccount: cloudshiftg-worker@PROJECT.iam.gserviceaccount.com
  terraformJob:
    name: cloudshiftg-terraform-job
    gcpServiceAccount: cloudshiftg-tf-job@PROJECT.iam.gserviceaccount.com

env:
  JOB_RUNTIME: k8s-job
  PUBSUB_TOPIC_PREFIX: cloudshiftg
  GCP_PROJECT_ID: PROJECT
  AWS_REGION: us-east-1

secrets:
  # Owned by External Secrets Operator in Phase B (Secret Manager → K8s).
  # phase-a-sync-k8s-secrets.* is break-glass only.
  name: cloudshiftg-secrets
  # After AWS SM versions exist and ExternalSecret syncs, set false.
  awsOptional: false

ingress:
  enabled: true
  className: gce
  host: cloudshiftg.example.com
  tls: true
  managedCertificate: true

pdb:
  web:
    minAvailable: 1
  worker:
    minAvailable: 1

networkPolicy:
  enabled: true
