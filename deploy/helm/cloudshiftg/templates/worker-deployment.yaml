apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullname }}-worker
  labels:
    app.kubernetes.io/name: cloudshiftg
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudshiftg
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudshiftg
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.worker.name }}
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/worker:{{ .Values.image.workerTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: JOB_RUNTIME
              value: "pubsub"
            - name: PUBSUB_TOPIC_PREFIX
              value: {{ .Values.env.PUBSUB_TOPIC_PREFIX | quote }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.env.GCP_PROJECT_ID | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
            - name: APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: APP_DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: SESSION_SECRET
          readinessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 15
            periodSeconds: 60
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
