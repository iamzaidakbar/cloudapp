apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullname }}-web
  labels:
    app.kubernetes.io/name: cloudshiftg
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudshiftg
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudshiftg
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ .Values.serviceAccount.web.name }}
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/web:{{ .Values.image.webTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: JOB_RUNTIME
              value: {{ .Values.env.JOB_RUNTIME | quote }}
            - name: PUBSUB_TOPIC_PREFIX
              value: {{ .Values.env.PUBSUB_TOPIC_PREFIX | quote }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.env.GCP_PROJECT_ID | quote }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TERRAFORM_JOB_IMAGE
              value: "{{ .Values.image.registry }}/terraform-job:{{ .Values.image.terraformJobTag }}"
            - name: TERRAFORM_JOB_SERVICE_ACCOUNT
              value: {{ .Values.serviceAccount.terraformJob.name | quote }}
            {{- if .Values.cloudsql.enabled }}
            - name: CLOUDSQL_INSTANCE_CONNECTION_NAME
              value: {{ .Values.cloudsql.instanceConnectionName | quote }}
            - name: CLOUDSQL_PROXY_IMAGE
              value: {{ .Values.cloudsql.proxyImage | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
            - name: APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: APP_DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: SESSION_SECRET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: AWS_ACCESS_KEY_ID
                  optional: {{ .Values.secrets.awsOptional }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: {{ .Values.secrets.awsOptional }}
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: AWS_REGION
                  optional: {{ .Values.secrets.awsOptional }}
            - name: GCP_BILLING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: GCP_BILLING_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
        {{- if .Values.cloudsql.enabled }}
        {{- include "cloudshiftg.cloudSqlProxyContainer" . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullname }}-web
  labels:
    app.kubernetes.io/name: cloudshiftg
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudshiftg
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
