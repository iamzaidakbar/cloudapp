{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.fullname }}-migrate-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: cloudshiftg
    app.kubernetes.io/component: migrate
  annotations:
    # post-install so ServiceAccounts exist; pre-upgrade before rolling pods
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudshiftg
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.web.name }}
      {{- if .Values.cloudsql.enabled }}
      initContainers:
        - name: cloud-sql-proxy
          image: {{ .Values.cloudsql.proxyImage | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - {{ .Values.cloudsql.instanceConnectionName | quote }}
          restartPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/worker:{{ .Values.image.workerTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
            - name: APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: APP_DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: SESSION_SECRET
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for Cloud SQL Auth Proxy..."
              for i in $(seq 1 60); do
                if node -e "const net=require('net');const s=net.connect(5432,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"; then
                  break
                fi
                sleep 2
              done
              echo "Running prisma migrate deploy..."
              npx prisma migrate deploy
              echo "Granting cloudshiftg_app privileges..."
              node -e "
                const { Client } = require('pg');
                const fs = require('fs');
                (async () => {
                  const sql = fs.readFileSync('/app/scripts/cloudsql/grant-app-role.sql','utf8');
                  const client = new Client({ connectionString: process.env.DATABASE_URL });
                  await client.connect();
                  await client.query(sql);
                  await client.end();
                  console.log('grants applied');
                })().catch((e) => { console.error(e); process.exit(1); });
              "
              echo "Migrate complete"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
{{- end }}
