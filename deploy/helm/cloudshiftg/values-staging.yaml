environment: staging

cloudsql:
  enabled: true

migrate:
  # Safe with hook-failed delete policy on the migrate Job template.
  enabled: true

web:
  replicas: 1
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4

worker:
  # Strategy B (Phase I): keep 0 while sharing Autopilot SSD quota with development.
  # Scale to 1 only for staging audits/comparisons when development worker is also 0.
  replicas: 0
  hpa:
    enabled: false
    minReplicas: 0
    maxReplicas: 4

ingress:
  # Deferred with Phase H — no domain / no paid DNS. Use port-forward :8082.
  enabled: false
  host: cloudshiftg-staging.example.com

secrets:
  awsOptional: false
