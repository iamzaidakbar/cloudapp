name: Deploy GKE

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [development, staging, production]

env:
  REGION: us-east1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  AR_REPO: cloudshiftg
  # Push to main always targets staging (do not auto-overwrite development).
  DEFAULT_ENV: staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Resolve target namespace
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ns=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "ns=${{ env.DEFAULT_ENV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REGISTRY: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}
        run: |
          docker build -t "$REGISTRY/web:$TAG" -f Dockerfile .
          docker build -t "$REGISTRY/worker:$TAG" -f Dockerfile.worker .
          docker build -t "$REGISTRY/terraform-job:$TAG" -f Dockerfile.terraform-job .
          docker push "$REGISTRY/web:$TAG"
          docker push "$REGISTRY/worker:$TAG"
          docker push "$REGISTRY/terraform-job:$TAG"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ env.REGION }}

      - name: Helm upgrade
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REGISTRY: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}
          NS: ${{ steps.target.outputs.ns }}
          SQL_INSTANCE: ${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }}
          WEB_GSA: ${{ secrets.WEB_GSA_EMAIL }}
          WORKER_GSA: ${{ secrets.WORKER_GSA_EMAIL }}
          TF_JOB_GSA: ${{ secrets.TERRAFORM_JOB_GSA_EMAIL }}
        run: |
          VALUES_FILE="deploy/helm/cloudshiftg/values-${NS}.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            echo "Missing values file: $VALUES_FILE"
            exit 1
          fi
          # Schema migrate runs in-cluster via Helm migrate Job (Cloud SQL proxy),
          # not on the GitHub runner (private IP only).
          helm upgrade --install cloudshiftg deploy/helm/cloudshiftg \
            --namespace "$NS" --create-namespace \
            -f "$VALUES_FILE" \
            --set image.registry="$REGISTRY" \
            --set image.webTag="$TAG" \
            --set image.workerTag="$TAG" \
            --set image.terraformJobTag="$TAG" \
            --set env.GCP_PROJECT_ID="$PROJECT_ID" \
            --set cloudsql.instanceConnectionName="$SQL_INSTANCE" \
            --set serviceAccount.web.gcpServiceAccount="$WEB_GSA" \
            --set serviceAccount.worker.gcpServiceAccount="$WORKER_GSA" \
            --set serviceAccount.terraformJob.gcpServiceAccount="$TF_JOB_GSA" \
            --set secrets.awsOptional=false \
            --wait --timeout 15m
