services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudshiftg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudshiftg
      POSTGRES_PASSWORD: cloudshiftg
      POSTGRES_DB: cloudshiftg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudshiftg"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cloudshiftg-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Reach Postgres by service name inside the compose network (host .env uses localhost).
      DATABASE_URL: postgresql://cloudshiftg:cloudshiftg@postgres:5432/cloudshiftg?schema=public
      APP_DATABASE_URL: postgresql://cloudshiftg_app:cloudshiftg_app@postgres:5432/cloudshiftg?schema=public
      JOB_RUNTIME: inline
      # Reliable file watching with Docker Desktop on Windows/macOS.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  web_node_modules:
  web_next:
